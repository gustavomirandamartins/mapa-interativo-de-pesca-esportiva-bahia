<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pesca Esportiva na Bahia · Fishing Show Brazil 2026</title>
<meta name="description" content="Mapa interativo dos principais destinos de pesca esportiva do Estado da Bahia — Governo da Bahia · Fishing Show Brazil 2026.">

<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app" class="app">

  <!-- Tela de abertura -->
  <div id="intro-screen" class="intro-screen">
    <div class="intro-card">
      <img src="assets/BAHIA_TURISMO.png" alt="Bahia Turismo" class="intro-logo">
      <div class="intro-title">Pesca Esportiva na Bahia</div>
      <div id="intro-stats" class="intro-stats"></div>
      <button id="intro-btn" class="intro-btn" type="button">Explorar o mapa</button>
    </div>
  </div>

  <header class="header">
    <img src="assets/BAHIA_TURISMO.png" alt="Bahia Turismo" class="brand-logo">
    <div class="brand-text">
      <div class="eyebrow">Governo da Bahia · Fishing Show Brazil 2026</div>
      <div class="title">Pesca Esportiva na Bahia</div>
    </div>
    <div class="header-actions">
      <div class="view-tabs" role="tablist">
        <button id="tab-mapa" class="view-tab is-active" type="button" role="tab" aria-selected="true">Mapa</button>
        <button id="tab-especies" class="view-tab" type="button" role="tab" aria-selected="false">Espécies</button>
      </div>
      <button id="btn-reset" class="btn-reset" type="button">↺ Mapa geral</button>
    </div>
  </header>

  <div id="map-wrap" class="map-wrap">
    <div id="pescamap" class="map"></div>
    <div class="map-vignette"></div>

    <!-- Filter dropdown -->
    <div class="filter-panel">
      <button id="filter-trigger" class="filter-trigger" type="button" aria-expanded="false">
        <span class="filter-trigger-label">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon-shrink"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
          Filtros
          <span id="filter-count" class="filter-count-badge" hidden>0</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="filter-chevron" class="icon-shrink"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>

      <div id="filter-body" class="filter-body" hidden>
        <div class="filter-section-label">Filtrar por espécie-troféu</div>
        <div id="trophy-chips" class="chip-row"></div>

        <div class="filter-section-label">Melhor época (mês)</div>
        <div id="month-chips" class="month-grid"></div>

        <div class="filter-footer">
          <div id="match-label" class="match-label">21 pontos mapeados</div>
          <button id="btn-clear-filters" class="btn-clear" type="button" hidden>Limpar</button>
        </div>
      </div>
    </div>

    <!-- Legend (always visible) -->
    <div class="legend-panel">
      <div class="legend-title">Legenda</div>
      <div class="legend-rows">
        <div id="legend-region" class="legend-row" data-kind="region">
          <span class="legend-icon legend-icon-region"><span class="legend-icon-region-dot"></span></span>
          <span>Zonas Turísticas</span>
        </div>
        <div id="legend-main" class="legend-row" data-kind="main">
          <span class="legend-icon legend-icon-main">1</span>
          <span>Destinos principais</span>
        </div>
        <div id="legend-secondary" class="legend-row" data-kind="secondary">
          <span class="legend-icon legend-icon-sec"></span>
          <span>Cidades e bases</span>
        </div>
        <div id="legend-proibida" class="legend-row" data-kind="proibida">
          <span class="legend-icon legend-icon-proibida"></span>
          <span>Pesca proibida</span>
        </div>
        <div id="legend-restrita" class="legend-row" data-kind="restrita">
          <span class="legend-icon legend-icon-restrita"></span>
          <span>Área protegida — restrições</span>
        </div>
      </div>
    </div>

    <!-- Detail panel -->
    <aside id="detail-panel" class="detail-panel" hidden></aside>

    <!-- Indicador discreto: só aparece quando o modo automático é desligado manualmente (tecla A) -->
    <div id="attract-off-indicator" class="attract-off-indicator" hidden>Modo automático desligado (A)</div>
  </div>

  <!-- Espécies -->
  <section id="species-view" class="species-view" hidden>
    <div class="species-toolbar">
      <div class="species-search-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="species-search-icon"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="species-search" class="species-search" type="search" placeholder="Buscar por nome, nome nacional, científico ou apelido...">
      </div>
    </div>
    <div id="species-groups" class="species-groups"></div>
    <aside id="species-detail-panel" class="detail-panel species-detail-panel" hidden></aside>
  </section>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/species.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
